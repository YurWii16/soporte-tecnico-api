# ============================================================
# Servidor
# ============================================================
server.port=8080
server.servlet.context-path=/api

# ============================================================
# H2 Database - DESARROLLO (activo por defecto)
# ============================================================
spring.datasource.url=jdbc:h2:mem:soportedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# PostgreSQL - PRODUCCIÓN (descomenta y comenta las de H2 arriba)
# ============================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/soporte_tecnico
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=tu_password
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# SpringDoc / Swagger UI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
