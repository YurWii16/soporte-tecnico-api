# ============================================================
# Servidor
# ============================================================
server.port=8080
server.servlet.context-path=/api

# ===============================
# CONFIGURACIÓN DE MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/soportedb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ===============================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===============================
# Esto creará o actualizará las tablas automáticamente según tus clases de Java
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola (útil para ver qué hace JPA por detrás)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# PostgreSQL - PRODUCCIÓN (descomenta y comenta las de H2 arriba)
# ============================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/soporte_tecnico
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=tu_password
